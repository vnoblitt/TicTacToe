<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="tictactoe.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Tic-Tac-Toe</h1>
    </div>

    <div class="body">
        <div class="sidebar">
            <a id="new-game">New Game</a>
            <div id="player-one-container"></div>
            <div id="player-two-container"></div> 
            <a id="win-toggle">X Plays</a>    
        </div>

        <div class="container">
            <!-- <button id="play-button">Play</button> -->
            <div id="board-container"></div>
            <p id="messages"></p>
        </div>
    </div>

    <dialog id="player-names">
        <div class="player">
            <label for="player-one">Player 1:</label> 
            <input id="player-one" class="player" required>
        </div>
        <div class="player">
            <label for="player-two">Player 2:</label> 
            <input id="player-two" class="player" required>
        </div>
        <button id="submit-names">Submit</button>
    </dialog>
</body>
</html>
